name: Talleyrand Deed Corpus Safeguard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  deed-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pyyaml pytest
      - name: Compile deed corpus validator
        run: python -m py_compile deed_corpus.py
      - name: Validate resolved deed corpus
        run: python -m pytest -q tests/test_deed_corpus.py
