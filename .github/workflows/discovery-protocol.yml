name: Talleyrand Discovery Protocol Safeguard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  discovery-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install pyyaml jsonschema pytest
      - name: Compile hard discovery boundary
        run: python -m py_compile discovery_protocol.py
      - name: Parse protocol and schema
        run: |
          python - <<'PY'
          import json, yaml
          json.load(open('contracts/discovery-record.schema.json'))
          yaml.safe_load(open('method/discovery-protocol.yaml'))
          PY
      - name: Run discovery protocol regressions
        run: python -m pytest -q tests/test_discovery_protocol.py
      - name: Validate committed discovery records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          from jsonschema import Draft202012Validator
          from discovery_protocol import validate_discovery_record

          schema = json.load(open('contracts/discovery-record.schema.json'))
          validator = Draft202012Validator(schema)
          records = sorted(Path('studies/vienna-correspondence').glob('*discovery-record*.yaml'))
          if not records:
              raise SystemExit('no committed discovery records found')
          for path in records:
              record = yaml.safe_load(path.read_text())
              errors = sorted(validator.iter_errors(record), key=lambda e: list(e.path))
              if errors:
                  raise SystemExit(f'{path}: schema failure: {errors[0].message}')
              validate_discovery_record(record)
              print(f'validated {path}')
          PY
