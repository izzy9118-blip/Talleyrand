name: Talleyrand Voice Page-Pin Safeguard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  voice-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pyyaml pytest
      - name: Compile voice boundary
        run: python -m py_compile voice_license.py
      - name: Validate page-pinned voice boundary
        run: python -m pytest -q tests/test_voice_license.py
