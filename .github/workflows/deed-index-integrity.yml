name: Talleyrand Deed Corpus Integrity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  deed-corpus-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install pyyaml pytest
      - name: Run deed corpus integrity tests
        run: python -m pytest -q tests/test_deed_index_integrity.py
