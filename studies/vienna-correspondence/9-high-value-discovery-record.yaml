      could_change: >-
        The counter-construction may support a bounded reconstruction but may not
        ground a deed that treats the anonymous informant's entire theory as established.

  - observation_id: OBS-CASTLEREAGH-ALIGNMENT-CAUSATION
    proposition: >-
      The later Franco-British alignment is documented, but Talleyrand's one-way
      causal account of converting Castlereagh conflicts with Castlereagh's own
      21 November account, which credits Wellington with making French influence
      more accommodating and describes Talleyrand as becoming less obstructive.
    evidence_class: DF
    support:
      - source_ref: TAL-SRC-006:Letter-XIX:1815-01-04:causal-ledger
        independence_group: talleyrand-royal-dispatch
        source_type: SELF_TESTIMONY
      - source_ref: TAL-SRC-007:Castlereagh-to-Wellington:1814-11-21:pp446-447
        independence_group: british-castlereagh-chain
        source_type: DIRECT_WITNESS
    channel:
      origin: Talleyrand and Castlereagh competing participant accounts
      immediate_sender: the two principals
      intermediaries:
        - edited documentary collections
      receiver: repository
      access_state: digitized primary correspondence
      formality: ministerial correspondence
    corroboration_state: CONTRADICTED
    audience:
