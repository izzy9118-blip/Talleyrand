  - observation_id: OBS-LETTER-IX-COUNTER-CONSTRUCTION
    proposition: >-
      The anonymous Letter IX counter-construction remains unverified as a whole.
      Independent British records support narrower elements: British policy actively
      managed French influence, used Wellington as an additional channel, and did not
      treat France as an unrestricted confidential partner during the early Vienna phase.
    evidence_class: SI
    support:
      - source_ref: TAL-SRC-005:Letter-IX:anonymous-informant
        independence_group: talleyrand-anonymous-informant-chain
        source_type: ATTRIBUTED_REPORT
      - source_ref: TAL-SRC-007:Castlereagh-to-Wellington:1814-11-21:pp446-447
        independence_group: british-castlereagh-chain
        source_type: DIRECT_WITNESS
      - source_ref: TAL-SRC-008:Castlereagh-document-sequence:1814-10-to-1815-01
        independence_group: british-castlereagh-chain
        source_type: PRIMARY_TRANSCRIPTION
    channel:
      origin: anonymous informant plus independent British ministerial correspondence
      immediate_sender: Talleyrand and Castlereagh document chains
      intermediaries:
        - edited documentary collections
      receiver: repository
      access_state: digitized edited primary collections
      formality: ministerial correspondence
    corroboration_state: PARTIALLY_CORROBORATED
    audience:
      immediate: Louis XVIII and British governmental addressees
      secondary: []
      true_audience_claim: false
      basis_source_refs: []
    disclosure_state: CONFIDENTIAL
    suppression:
