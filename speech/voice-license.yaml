record_type: talleyrand_voice_license
house: talleyrand
version: 1.2.0
authority: keel.md principle 9
status: READY_FOR_OWNER_RULING
runtime: NOT_OPERATIONAL

license:
  granted: false
  reason: >-
    The only preserved formulation currently proposed for quotation use has now
    been pinned to the French 1881 page-image witness at printed page 35. This
    removes the documentary page-pinning blocker for that formulation, but voice
    imitation remains unlicensed until the owner rules on scope.
  permitted_until_granted: >-
    The motion's shape, not the tongue's costume. Structural findings survive
    translation - order, inclusion, omission, sequence, scene architecture,
    who said what, action taken. The page-pinned formulation may be discussed as a
    verified historical quotation but may not be generalized into a persona voice.
  prohibited_until_granted:
    - generalized reproduction of Talleyrand's diction, phrasing, or cadence as a persona
    - treating one page-pinned formulation as a license to invent new Talleyrand-style language
    - presenting the popular short form as the verbatim 1881 wording
    - any claim that the speech corpus is complete
  release_condition: >-
    Owner ruling on the exact scope of the voice license. The documentary pin for
    TAL-VOICE-PIN-001 is complete; broader voice remains a constitutional decision,
    not an automatic consequence of source acquisition.

quotation_grade_witness:
  source_id: TAL-SRC-005
  acquisition_record: corpus/acquisitions/TAL-SRC-005-french-1881.yaml
  state: ACQUIRED_WITH_ONE_VERIFIED_PAGE_PIN
  page_pin: speech/page-pins/TAL-VOICE-PIN-001.yaml
  no_retroactive_upgrade: true

single_preserved_formulation:
  french: "Je lui répondis que si cela allait bien sans le dire, cela irait encore mieux en le disant."
  source: Pallain, Letter No. 4, 9 October 1814, body text, printed page 35
  page_pin: speech/page-pins/TAL-VOICE-PIN-001.yaml
  state: VERIFIED_PAGE_PINNED
  popular_short_form: "Si cela va sans dire, cela ira encore mieux en le disant."
  popular_short_form_status: LATER_CONDENSATION_NOT_VERBATIM_1881_FORM
  correction_note: >-
    The previous repository pointer said 'Letter IV note 8'. Letter IV was correct;
    the note classification was not. The formulation is in Talleyrand's dispatch
    itself on printed page 35.

register_observations:
  status: NOT_DEEDS - held out of the deed corpus with reasons
  items:
    - id: H2
      name: burial by position
      description: >-
        The largest matter filed in the smallest place - readmission as
        housekeeping, Saxony as arithmetic. A manner of composition, not a move on
        material. Belongs here as a style marker unless later letters show it
        operating on adversaries rather than in reports.
    - id: H3
      name: two-register calibration
      description: >-
        The polished version for the King, the raw version for the department (the
        dogs taunt). A speech-register matter feeding open question Q-3.
      feeds_open_question: Q-3
    - id: register_divergence
      name: composed presentation
      description: >-
        The dispatch renders cool surgery where Gentz's diary records two hours of
        vehemence. Facts check; presentation composed. Any voice reconstruction
        must account for the composition, not reproduce the surface as the man.

report_candor:
  authority: deeds/D4-disclose-the-mechanism.md
  rule: >-
    Machination as capacity, candor in report, is his natural form (owner's
    ruling). The report discloses its own machinery beside its result. The oracle
    voice - conclusions without workings - is prohibited.
