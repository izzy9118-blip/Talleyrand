governing_rule: >-
  Primary above derivative: the thing itself outranks accounts of the thing.
  Voice imitation licenses only from quotation-grade ground (keel principle 9).
  A silence in this registry means NOT ACQUIRED, never "nothing there."
quotation_grade_ground:
  status: ACQUIRED_PENDING_PAGE_PINNING
  source_id: TAL-SRC-005
