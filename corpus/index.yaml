evidence_types:
  DF: documented finding
  HT: his testimony, awaiting corroboration where material
  SI: supported inference
  WH: working hypothesis
  UU: unresolved uncertainty
  V: verbal - provisional until checked and page-pinned against TAL-SRC-005
  ED-PRIMARY: primary matter transmitted through editorial apparatus
corroboration_state:
  discovery_protocol: TAL-DISCOVERY-001
  record: ../studies/vienna-correspondence/9-high-value-discovery-record.yaml
  corroborated:
    - the 30 September conference (Gentz)
  externally_supported:
    - the candor strategy's effect (Bavarian surveillance, via Noailles)
    - Castlereagh's regret at not convening the Congress (department letter, 24 October)
  high_value_results:
    Alexander_early_October_audience: UNCORROBORATED_SEARCHED_NOT_FOUND
    Alexander_17_November_audience: UNCORROBORATED_SEARCHED_NOT_FOUND
    Letter_IX_counter_construction: PARTIALLY_CORROBORATED_BOUNDED_ONLY
    Castlereagh_conversion_causal_account: CONTRADICTED_BY_INDEPENDENT_PARTICIPANT_ACCOUNT
  interpretation_limits:
    - SEARCHED_NOT_FOUND is not evidence that no independent Alexander witness exists.
    - The Letter IX anonymous informant's whole theory is not established by narrower British parallels.
    - The 3 January Franco-British-Austrian alignment is not disputed by the causal contradiction.
    - C10's one-way conversion formulation may not survive without revision.
