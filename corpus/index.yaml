  acquisition_record: acquisitions/TAL-SRC-005-french-1881.yaml
  consequence: >-
    No voice imitation is licensed yet. Exact formulations remain provisional until
    the printed page and scan page actually relied upon are pinned and checked,
    followed by the owner's ruling.
