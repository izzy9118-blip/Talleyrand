evidence_types:
  DF: documented finding
  HT: his testimony, awaiting corroboration where material
  SI: supported inference
  WH: working hypothesis
  UU: unresolved uncertainty
  V: verbal - provisional until checked and page-pinned against TAL-SRC-005
  ED-PRIMARY: primary matter transmitted through editorial apparatus
corroboration_state:
  corroborated:
    - the 30 September conference (Gentz)
  externally_supported:
    - the candor strategy's effect (Bavarian surveillance, via Noailles)
    - Castlereagh's regret at not convening the Congress (department letter, 24 October)
  uncorroborated_and_high_value:
    - Jacobi-Kloest
    - both Alexander audiences
    - the Letter IX counter-construction
    - causal detail of Castlereagh's conversion into the 3 January alignment
witnesses_to_pursue:
  - {id: Gentz, state: VERIFIED_ONLINE}
  - {id: "Castlereagh correspondence, volume 10", state: PRESENT}
  - {id: "Metternich, memoirs", state: PRESENT}
  - {id: Muenster, state: NOT_ACQUIRED}
  - {id: "d'Angeberg, documents", state: NOT_ACQUIRED}
  - {id: Jaucourt, state: NOT_ACQUIRED}
  - {id: "Wellington, supplementary despatches", state: NOT_ACQUIRED}
  - {id: Nesselrode, state: NOT_ACQUIRED}
most_wanted:
