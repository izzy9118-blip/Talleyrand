admission_limits:
  - These sources corroborate or contradict only propositions they actually cover.
  - Publication in an edited collection does not make two documents independent if they share one originating chain.
  - Neither source supplies an independent witness to the decisive dialogue inside Talleyrand's Alexander audiences found during this probe.
  - Failure to locate such a witness is SEARCHED_NOT_FOUND, not evidence that no witness exists.
