owner_ruling_law:
  - The owner may ratify, decline, or return any decision unit for revision.
  - A ratification applies only to the exact Git blob identified in this dossier.
  - Changed text requires a new dossier binding before ratification.
  - Ratifying a deed does not certify historical truth, semantic completeness, or voice fidelity.
  - Ratifying TAL-DISCOVERY-001 does not certify the completeness of any discovery record.
  - No excluded candidate may become a deed through this dossier.
  - Voice remains WITHHELD regardless of deed ratification until its separate French page-image gate and owner ruling are satisfied.
  - Minister establishment in Sanctum is a later and separate owner act.
