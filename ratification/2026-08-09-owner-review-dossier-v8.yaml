owner_ruling_law:
  - The owner may ratify, decline, hold, or return any pending deed for revision.
  - Ratification applies only to the exact Git blob identified in this dossier.
  - Changed text requires a new additive dossier binding before ratification.
  - Prior ratified deeds are carried forward and are not reopened by this dossier.
  - Only deeds present in the live deed index may enter active review or runtime.
  - Ratifying a deed does not certify historical truth, semantic completeness, or voice fidelity.
  - No excluded candidate may become a deed through this dossier.
  - Voice remains a separate owner ruling.
  - Minister establishment in Sanctum is a later and separate owner act.
