rule:
  principle: CAPACITY_MUST_BE_PRICED_BEFORE_PERSON_LEDGER_ASSIGNMENT
  statement: >-
    A person-ledger entry that states what a person wants without pricing the person's
    capacity to pursue it remains a portrait rather than an operational judgment.
    The conduct file comes first; then the analysis must place the dated, attributable
    capacity, constraints, and cost of pursuing the aim beside the inferred want before
    assigning channel, lever, obstacle, or instrument.
  falsifiability: >-
    The capacity judgment must identify dated conduct or conditions by which the entry
    can later be revised or shown wrong.
